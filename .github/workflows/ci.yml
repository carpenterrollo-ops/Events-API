name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t events-api:latest .

      - name: Start Container
        run: |
          docker run -d -p 5000:5000 --name events-api events-api:latest

      - name: Health Check (API ready)
        run: |
          echo "Warte auf API-Start und fuehre Health-Check durch..."
          for i in 1 2 3; do
            echo "Versuch $i von 3..."
            if curl -f -s http://localhost:5000/api/health; then
              echo -e "\nAPI ist healthy!"
              exit 0
            fi
            echo "API noch nicht bereit, warte 3 Sekunden..."
            sleep 3
          done
          echo "Health-Check nach 3 Versuchen fehlgeschlagen!"
          docker logs events-api
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: Run test suite against container
        run: |
          pytest -v

      - name: Cleanup Container
        if: always()
        run: |
          echo "Stoppe und entferne den Container..."
          docker rm -f events-api || true

  deploy:
    name: Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest

      - name: Trigger Render Deployment
        run: |
          echo "Triggering Render Deploy Hook..."
          curl -f -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo -e "\nRender deployment triggered successfully."

      - name: Wait for Render Deployment Initialization
        run: |
          echo "Warte 30 Sekunden, bis Render das Deployment initialisiert..."
          sleep 30

      - name: Run Smoke Tests against Live API
        env:
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          BASE_URL="${RENDER_BASE_URL%/}"
          echo "Target Base URL: ${BASE_URL}"

          echo "=== 1. Health-Check aufrufen (${BASE_URL}/api/health) ==="
          HEALTHY=false
          for i in {1..12}; do
            echo "Versuch $i von 12..."
            HTTP_CODE=$(curl -s -o /tmp/health_response.json -w "%{http_code}" "${BASE_URL}/api/health" || echo "000")
            echo "HTTP Status: $HTTP_CODE"
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "Antwort: $(cat /tmp/health_response.json)"
              HEALTHY=true
              break
            fi
            echo "API noch nicht bereit (HTTP $HTTP_CODE). Warte 10 Sekunden..."
            sleep 10
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "FEHLER: Health-Check nach 12 Versuchen fehlgeschlagen!"
            exit 1
          fi

          echo -e "\n=== 2. Read-Endpunkt aufrufen (${BASE_URL}/api/events) ==="
          EVENTS_HTTP_CODE=$(curl -s -o /tmp/events_response.json -w "%{http_code}" "${BASE_URL}/api/events" || echo "000")
          echo "HTTP Status: $EVENTS_HTTP_CODE"
          if [ "$EVENTS_HTTP_CODE" -ne 200 ]; then
            echo "FEHLER: Events-Endpunkt lieferte unerwarteten Statuscode: $EVENTS_HTTP_CODE"
            exit 1
          fi
          echo "Events-Endpunkt erfolgreich erreichbar!"
          echo "Smoke-Test erfolgreich abgeschlossen."
