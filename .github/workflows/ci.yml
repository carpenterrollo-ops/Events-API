name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t events-api:ci .

      - name: Start Container
        run: |
          docker run -d -p 5000:5000 --name events-api events-api:ci

      - name: Health Check (API ready)
        run: |
          echo "Warte auf API-Start und fuehre Health-Check durch..."
          for i in 1 2 3; do
            echo "Versuch $i von 3..."
            if curl -f -s http://localhost:5000/api/health; then
              echo -e "\nAPI ist healthy!"
              exit 0
            fi
            echo "API noch nicht bereit, warte 3 Sekunden..."
            sleep 3
          done
          echo "Health-Check nach 3 Versuchen fehlgeschlagen!"
          docker logs events-api
          exit 1
