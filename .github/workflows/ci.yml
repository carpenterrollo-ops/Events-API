name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t events-api:latest .

      - name: Start Container
        run: |
          docker run -d -p 5000:5000 --name events-api events-api:latest

      - name: Health Check (API ready)
        run: |
          echo "Warte auf API-Start und fuehre Health-Check durch..."
          for i in 1 2 3; do
            echo "Versuch $i von 3..."
            if curl -f -s http://localhost:5000/api/health; then
              echo -e "\nAPI ist healthy!"
              exit 0
            fi
            echo "API noch nicht bereit, warte 3 Sekunden..."
            sleep 3
          done
          echo "Health-Check nach 3 Versuchen fehlgeschlagen!"
          docker logs events-api
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: Run test suite against container
        run: |
          pytest -v

      - name: Cleanup Container
        if: always()
        run: |
          echo "Stoppe und entferne den Container..."
          docker rm -f events-api || true

  deploy:
    name: Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest

      - name: Trigger Render Deployment
        run: |
          echo "Triggering Render Deploy Hook..."
          curl -f -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo -e "\nRender deployment triggered successfully."

      - name: Wait for Render Deployment
        run: |
          echo "Warte 60 Sekunden, bis Render das Image gepullt und den Container gestartet hat..."
          sleep 60
